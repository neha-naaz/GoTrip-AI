services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: tripflow
      POSTGRES_USER: tripflow
      POSTGRES_PASSWORD: tripflow
    ports:
      - "5433:5432"
    volumes:
      - tripflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripflow -d tripflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/tripflow
      SPRING_DATASOURCE_USERNAME: tripflow
      SPRING_DATASOURCE_PASSWORD: tripflow
      TRIPFLOW_JWT_SECRET: KdB1K7rGNM1S4xP9yP8Yv1qGhT6uZ7aE5rN2cH0jL3Q=
      TRIPFLOW_JWT_EXPIRATION_MS: "86400000"
      TRIPFLOW_PAYMENT_PROVIDER: razorpay
      TRIPFLOW_PAYMENT_WEBHOOK_SECRET: local-dev-secret
      TRIPFLOW_RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      TRIPFLOW_RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      TRIPFLOW_RAZORPAY_WEBHOOK_SECRET: ${TRIPFLOW_RAZORPAY_WEBHOOK_SECRET:-}
      TRIPFLOW_DEMO_AUTO_VERIFY_AGENCIES: "true"
      TRIPFLOW_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000
      TRIPFLOW_MEDIA_ROOT_DIR: /app/data/media
      SPRING_DEVTOOLS_RESTART_ENABLED: "false"
    volumes:
      - tripflow_media:/app/data/media
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080
        VITE_RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  tripflow_pgdata:
  tripflow_media:
