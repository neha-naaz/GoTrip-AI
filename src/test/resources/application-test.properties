spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Same shape as local default (Base64); must decode to >= 256-bit key
tripflow.jwt.secret=KdB1K7rGNM1S4xP9yP8Yv1qGhT6uZ7aE5rN2cH0jL3Q=
tripflow.jwt.expiration-ms=3600000
tripflow.payment.provider=mock
tripflow.payment.webhook-secret=test-webhook-secret
