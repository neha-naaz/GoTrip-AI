spring.application.name=tripflow
spring.config.import=optional:file:.env

spring.datasource.url=jdbc:postgresql://localhost:5433/tripflow
spring.datasource.username=tripflow
spring.datasource.password=tripflow

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

tripflow.jwt.secret=KdB1K7rGNM1S4xP9yP8Yv1qGhT6uZ7aE5rN2cH0jL3Q=
tripflow.jwt.expiration-ms=86400000

# mock | razorpay
tripflow.payment.provider=razorpay
tripflow.payment.webhook-secret=local-dev-secret
# Test keys for local Razorpay Checkout. Override in deploy; do not use live secrets here.
tripflow.payment.razorpay.key-id=rzp_test_SOMETHINGRandom
tripflow.payment.razorpay.key-secret=MYSECRETFORRANDOM
tripflow.payment.razorpay.webhook-secret=${TRIPFLOW_RAZORPAY_WEBHOOK_SECRET:}
tripflow.booking.pending-expiry-minutes=15
tripflow.booking.expiry-check-interval-ms=60000

# Local demo: new agencies can publish without a manual verify step
tripflow.demo.auto-verify-agencies=true
# Override for deploy: TRIPFLOW_CORS_ALLOWED_ORIGINS=https://your-frontend.example
tripflow.cors.allowed-origins=http://localhost:5173,http://localhost:3000

tripflow.media.root-dir=./data/media
tripflow.media.max-bytes=5242880
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
